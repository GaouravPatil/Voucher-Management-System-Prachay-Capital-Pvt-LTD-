services:
  postgres:
    image: postgres:15-alpine
    container_name: evms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evms
      POSTGRES_PASSWORD: evms_password
      POSTGRES_DB: evms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evms -d evms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
